<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Xendows Notes"
    >

    <title>xendows</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Candal&family=Lora:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         MAIN NAVIGATION
    ========================== -->
    <nav class="main-navbar">

        <!-- Hamburger -->
        <button
            class="hamburger"
            id="hamburger"
            aria-label="Open navigation menu"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Logo -->
        <a href="index.html" class="logo">
            Xendows
        </a>

        <!-- Navigation -->
        <div class="nav-options" id="navOptions">
            <a href="index.html" class="nav-link active">
                Notes
            </a>

            <a href="pages/courses.html" class="nav-link">
                Courses
            </a>

            <a href="pages/about.html" class="nav-link">
                About
            </a>
        </div>

        <!-- Profile badge -->
        <div class="profile-badge">
            <img
                src="assets/images/profile.png"
                alt="Profile image"
            >

            <span class="profile-tooltip">
                Xendows Profile
            </span>
        </div>

    </nav>


    <!-- =========================
         SCROLLING INFORMATION BAR
    ========================== -->
    <div class="scroll-bar">
        <div class="scroll-text">
            Welcome to Xendows — This is a sample scrolling sentence which you can replace with your own important information, announcements, updates, notes, courses, and website content later.
        </div>
    </div>


    <!-- =========================
         NOTES CONTENT
    ========================== -->
    <main class="content-area">

        <section
            class="cards-grid"
            id="notesContainer"
            aria-label="Notes"
        >
            <!-- Cards generated by app.js -->
        </section>

    </main>


    <!-- =========================
         APP LINKS
    ========================== -->
    <footer class="app-links">
        <a href="#" aria-label="Android App">
            Android
        </a>

        <span>|</span>

        <a href="#" aria-label="iOS App">
            iOS
        </a>
    </footer>


    <!-- JavaScript -->
    <script src="js/security.js" defer></script>
    <script src="js/app.js" defer></script>

</body>
</html>
